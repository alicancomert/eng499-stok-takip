function olc(kod, r, sapma = 0.03) {
  const g = G[kod];
  let s = (g.smin + g.smax) / 2 + r.gauss(0, 0.6);
  const n = (g.nmin + g.nmax) / 2 + r.gauss(0, 2);
  if (r() < sapma) s = g.smax + r.uniform(2, 6); // kapı açık kaldı / soğutucu arızası
  return [yuvarla(s, 1), yuvarla(Math.min(Math.max(n, 0), 100), 1)];
}

}

function sapmaCezasiSaat(kod, okumalar) {
  const tavan = G[kod].smax;
  let ceza = 0;
  for (let i = 0; i < okumalar.length - 1; i++) {
    const [t1, s1] = okumalar[i], [t2] = okumalar[i + 1];
    if (s1 > tavan) ceza += Math.min((t2 - t1) / SAAT_MS, AYAR.maksAralikSaat) * (AYAR.q10 ** ((s1 - tavan) / 10) - 1);
  }

}
function fefoDurumu(kalan, toplam) {

    return oran <= AYAR.eskiOran ? "ESKI" : oran <= AYAR.ortaOran ? "ORTA" : "YENI";
  }
  return kalan <= AYAR.eskiGun ? "ESKI" : kalan <= AYAR.ortaGun ? "ORTA" : "YENI";
}

function tarih6(s) {
  if (!/^\d{6}$/.test(s)) throw new Hata(`Geçersiz tarih alanı: ${s}`);
  const y = 2000 + +s.slice(0, 2), m = +s.slice(2, 4);
  let d = +s.slice(4);
  if (m < 1 || m > 12) throw new Hata(`Geçersiz tarih: ${s}`);
  if (d === 0) d = new Date(y, m, 0).getDate(); // GS1: gün 00 → ayın son günü
  const t = new Date(y, m - 1, d);
  if (t.getMonth() !== m - 1) throw new Hata(`Geçersiz tarih: ${s}`);
  return t;
}
function barkodCoz(ham) {
  ham = ham.trim();
  if (!ham) throw new Hata("Boş barkod");
  if (/^\d+$/.test(ham)) {
    if (![8, 12, 13, 14].includes(ham.length)) throw new Hata(`Geçersiz barkod uzunluğu: ${ham.length}`);
    return { gtin: ham.padStart(14, "0"), miktar: 1 };
  }
  const alan = {};
  for (const [, k, v] of ham.matchAll(/\((\d{2,4})\)([^()]+)/g)) alan[k] = v;
  if (!alan["01"]) throw new Hata("Barkodda GTIN (01) alanı yok");
  const b = { gtin: alan["01"].trim().padStart(14, "0"), miktar: 1 };
  if (alan["10"]) b.lotNo = alan["10"].trim();
  if (alan["11"]) b.uretim = tarih6(alan["11"]);
  if (alan["17"]) b.skt = tarih6(alan["17"]); else if (alan["15"]) b.skt = tarih6(alan["15"]);
  if (alan["30"]) {
    if (!/^\d+$/.test(alan["30"]) || +alan["30"] <= 0) throw new Hata(`Geçersiz miktar: ${alan["30"]}`);
    b.miktar = +alan["30"];
  }
  return b;
}

    if (skor < 0 || skor > 1) { rapor.uyarilar.push(`${td.pid}: skor 0-1 aralığında değil (${skor}), atlandı`); return; }
    td.bozuk = td.alert || skor < AYAR.bozulma || kosulBozuk(td.kosul);
    if ((skor < AYAR.bozulma) !== kosulBozuk(td.kosul)) rapor.uyarilar.push(`${td.pid}: etiket '${td.kosul}' ile skor ${skor} çelişiyor`);
    rapor.tespitler.push(td);

  if (veri.total_items != null && veri.total_items !== veri.items.length) rapor.uyarilar.push(`total_items=${veri.total_items} ama listede ${veri.items.length} ürün var`);

}

function gunlukTalep(gtin) {

  const bas = new Date(bugun); bas.setDate(bas.getDate() - AYAR.tahminGecmis);
  for (const h of S.hareketler) {
    if (h.gtin !== gtin || h.tur !== "CIKIS" || h.t < bas.getTime() || h.t >= bugun.getTime()) continue;
    const i = idx[gunAnahtar(new Date(h.t))];

const bosTahmin = s => s.map(() => null);
const YONTEMLER = {

  "Ağırlıklı H.O. (7)": (s, u) => { const n = 7, w = p => p.reduce((x, v, i) => x + (i + 1) * v, 0) / 28, t = bosTahmin(s); for (let i = n; i < s.length; i++) t[i] = w(s.slice(i - n, i)); return [t, Array(u).fill(w(s.slice(-n)))]; },
  "Üstel Düzeltme (α=0.3)": (s, u) => { const a = 0.3, t = bosTahmin(s); let sv = s[0]; for (let i = 1; i < s.length; i++) { t[i] = sv; sv = a * s[i] + (1 - a) * sv; } return [t, Array(u).fill(sv)]; },
  "Holt (α=0.3, β=0.1)": (s, u) => { const a = 0.3, b = 0.1, t = bosTahmin(s); let sv = s[0], tr = s[1] - s[0]; for (let i = 1; i < s.length; i++) { t[i] = Math.max(sv + tr, 0); const on = sv; sv = a * s[i] + (1 - a) * (sv + tr); tr = b * (sv - on) + (1 - b) * tr; } return [t, Array.from({ length: u }, (_, h) => Math.max(sv + (h + 1) * tr, 0))]; },
  "Mevsimsel Naif (7)": (s, u) => { const d = 7, t = bosTahmin(s); for (let i = d; i < s.length; i++) t[i] = s[i - d]; return [t, Array.from({ length: u }, (_, h) => s[s.length - d + (h % d)])]; },
};
function hataOlculeri(gercek, tahmin, son = AYAR.degerlendirme) {
  const g = gercek.slice(-son), t = tahmin.slice(-son), ciftler = [];
  g.forEach((x, i) => { if (t[i] != null) ciftler.push([x, t[i]]); });
  if (!ciftler.length) return null;
  const e = ciftler.map(([x, y]) => x - y);
  const mad = ort(e.map(Math.abs)), rmse = Math.sqrt(ort(e.map(x => x * x)));

function tahminRaporu() {

function ornekOlustur() {
  S = bosDurum();
  const simdi = Date.now(), r = rng(42);
  S.urunler = URUNLER.map(([gtin, ad, grup, omur, renk, minStok, tedarik, ortTalep]) => ({ gtin, ad, grup, omur, renk, minStok, tedarik, ortTalep }));
  for (const u of S.urunler) { // 90 günlük tüketim: hafif trend + haftalık mevsimsellik + gürültü
    const trend = r.uniform(-0.002, 0.004);
    for (let geri = 90; geri > 0; geri--) {
      const gun = new Date(simdi); gun.setDate(gun.getDate() - geri); gun.setHours(14, 0, 0, 0);
      const bek = u.ortTalep * HAFTALIK[(gun.getDay() + 6) % 7] * (1 + trend * (90 - geri));
      const m = Math.max(0, Math.round(r.gauss(bek, Math.sqrt(bek))));
      if (m) hareket(gun.getTime(), u.gtin, null, "CIKIS", m);
    }
  }
  for (let saat = 72; saat >= 0; saat--) { // 72 saatlik sensör geçmişi; G3'te 30-34 saat önce soğutma arızası
    const t = simdi - saat * SAAT_MS;
    for (const g of GRUPLAR) {
      let [s, n] = olc(g.kod, r, 0);
      if (g.kod === "G3" && saat >= 30 && saat <= 34) s = 12.0;
      S.sensor[g.kod].push([t, s, n]);
    }
  }
  const giris = simdi - 48 * SAAT_MS; // mevcut lotlar 48 saat önce girmiş
  SAAT = () => giris; renkRnd = r;
  for (const u of S.urunler) {
    for (let i = 0; i < (u.omur > 60 ? 2 : 3); i++) {
      let yas = r.uniform(0.05, 0.9) * u.omur;
      if (r() < 0.85) yas = Math.min(yas, u.omur - 2 - r.uniform(0.3, 1.5));
      const uretim = new Date(giris - yas * GUN), miktar = r.int(Math.floor(u.minStok / 2) + 1, u.minStok * 2);
      barkodOkut(`(01)${u.gtin}(11)${yymmdd(uretim)}(10)L${r.int(1000, 9999)}(30)${miktar}`, "GIRIS");
    }
  }
  SAAT = () => simdi;
  const ornek = JSON.parse(JSON.stringify(EKIP_CIKTISI)); // ekibin taraması, 1 saat önce yapılmış gibi
  ornek.timestamp = new Date(simdi - SAAT_MS).toISOString();
  raporKaydet(raporCoz(ornek), "örnek veri (ekip çıktısı)");
  yenidenKonumlandir();
  SAAT = () => Date.now(); renkRnd = canliRnd;
  kaydet();
}

      <tbody>${gecmis.map(o => `<tr class="${o.basarili ? "" : "hata"}"><td>${fDTs(o.t)}</td><td>${o.islem === "GIRIS" ? "Giriş" : "Çıkış"}</td><td>${esc(urun(o.gtin)?.ad || "–")}</td><td class="mono">${esc(lotNo[o.lotId] || "–")}</td><td>${o.durum ? durumHap(o.durum) : "–"}</td><td class="mono">${esc(konum[o.lotId] || "–")}</td><td class="uzun">${esc(o.mesaj)}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>`;
}
function demoBarkod() {
  const u = S.urunler[Math.floor(Math.random() * S.urunler.length)];
  let b;
  if (UI.islem === "CIKIS") b = `(01)${u.gtin}(30)${1 + Math.floor(Math.random() * 5)}`;
  else {
    const uretim = new Date(Date.now() - Math.random() * 0.9 * u.omur * GUN);
    b = `(01)${u.gtin}(11)${yymmdd(uretim)}(10)L${1000 + Math.floor(Math.random() * 9000)}(30)${1 + Math.floor(Math.random() * 20)}`;
  }
  const g = $("barkod"); g.value = b; g.focus();
}

// ---------- yerleşim
const DURUM_VAR = { ESKI: "var(--eski)", ORTA: "var(--orta)", YENI: "var(--yeni)", SKT_GECTI: "var(--skt)" };
function yerlesimCiz() {
  const lotlar = Object.fromEntries(aktifLotlar().map(l => [l.id, l]));
  let h = `<div class="kapi">KAPI</div><div></div>`;
  for (const [bant, [a, b]] of Object.entries(BANTLAR)) h += `<div class="bant-bas" style="grid-column:${a + 2} / span ${b - a + 1};color:${DURUM_VAR[bant]};border-color:${DURUM_VAR[bant]}">${ETIKET[bant]} bandı</div>`;
  GRUPLAR.forEach((g, i) => {
    h += `<div class="koridor-ad" style="grid-row:${i + 2};grid-column:2"><b>${g.kod} ${esc(g.ad)}</b><span>${g.smin}…${g.smax} °C</span></div>`;
    for (let sira = 1; sira <= AYAR.sira; sira++) {
      const k = goz(g.kod, sira), l = lotlar[S.konum[k]];
      h += `<button type="button" class="goz ${l ? "dolu" : ""} ${UI.seciliGoz === k ? "secili" : ""}" data-a="goz" data-k="${k}" style="grid-row:${i + 2};grid-column:${sira + 2};${l ? `background:${DURUM_VAR[l.durum]}` : ""}" aria-label="${k}${l ? ` ${esc(l.ad)}` : " boş"}">
        <span class="kod">${k}</span>${l ? `<span class="ad">${esc(l.ad)}</span><span class="sayi">${l.miktar} · ${sayi(l.kalan)} g</span>` : ""}</button>`;
    }
  });
  let detay = `<p class="not">Bir göze tıkla.</p>`;
  if (UI.seciliGoz) {
    const l = lotlar[S.konum[UI.seciliGoz]];
    detay = l ? `<div class="bilgi-kutu"><b>${UI.seciliGoz} · ${esc(l.ad)} · lot ${esc(l.lotNo)}</b>
      <span>${l.miktar} birim · etkin SKT ${fDT(l.etkin)} (${sayi(l.kalan)} gün) · ${durumHap(l.durum)} · renk ${l.renk || "–"} · kamera tazeliği ${l.tazelik == null ? "–" : sayi(l.tazelik, 2)}</span></div>`
      : `<p class="not">${UI.seciliGoz}: boş (${ETIKET[bantOf(+UI.seciliGoz.slice(3))]} bandı)</p>`;
  }
  const tampon = aktifLotlar().filter(l => !l.konum && l.durum !== "SKT_GECTI");
  return `
  <section class="panel">
    <div class="arac">
      <button type="button" class="ana" data-a="konumlandir">FEFO'ya göre yeniden konumlandır</button>
      <span class="bosluk"></span>
      <div class="lejant">${["ESKI", "ORTA", "YENI", "SKT_GECTI"].map(durumHap).join("")}</div>
    </div>
    <div class="depo-kap"><div class="depo">${h}</div></div>
    ${detay}
    ${tampon.length ? `<p class="not">Tampon alanda ${tampon.length} lot var: ${tampon.map(l => esc(`${l.ad} (${l.lotNo})`)).join(", ")}</p>` : ""}
  </section>
  ${UI.tasima ? `<section class="panel"><h2>Taşıma listesi</h2>${UI.tasima.length ? `<div class="tablo-kap kaydir"><table><thead><tr><th>Ürün</th><th>Lot</th><th>Durum</th><th>Eski konum</th><th>Yeni konum</th></tr></thead><tbody>${UI.tasima.map(([l, e, y]) => `<tr><td>${esc(l.ad)}</td><td class="mono">${esc(l.lotNo)}</td><td>${durumHap(l.durum)}</td><td class="mono">${e || "tampon"}</td><td class="mono">${y || (l.durum === "SKT_GECTI" ? "karantina" : "tampon")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="not">Tüm lotlar doğru bantta, taşıma gerekmiyor.</p>`}</section>` : ""}`;
}

// ---------- stok
function stokCiz() {
  const lotlar = aktifLotlar().sort((a, b) => a.grup.localeCompare(b.grup) || a.ad.localeCompare(b.ad, "tr") || a.etkin - b.etkin);
  const dolan = lotlar.filter(l => l.durum === "SKT_GECTI").length;
  return `
  <section class="panel">
    <div class="arac">
      <button type="button" class="tehlike" data-a="imha" ${dolan ? "" : "disabled"}>SKT geçenleri imha et${dolan ? ` (${dolan})` : ""}</button>
      <span class="bosluk"></span>
      <b class="sayi">Son 30 gün israf oranı: %${sayi(100 * israfOrani(), 2)}</b>
    </div>
    <div class="tablo-kap kaydir"><table>
      <thead><tr><th>Ürün</th><th>Grup</th><th>Lot</th><th>Renk</th><th>Tazelik</th><th>Üretim</th><th>Etkin SKT</th><th>Kalan (gün)</th><th>Durum</th><th>Miktar</th><th>Konum</th></tr></thead>
      <tbody>${lotlar.map(l => `<tr><td>${esc(l.ad)}</td><td>${l.grup}</td><td class="mono">${esc(l.lotNo)}</td><td>${l.renk || "–"}</td><td>${l.tazelik == null ? "–" : sayi(l.tazelik, 2)}</td><td>${fD(l.uretim)}</td><td>${fDT(l.etkin)}${l.etkin < l.skt ? " *" : ""}</td><td class="yazi-${l.durum}">${sayi(l.kalan)}</td><td>${durumHap(l.durum)}</td><td>${l.miktar}</td><td class="mono">${l.konum || "TAMPON"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="not">* Etkin SKT, sıcaklık sapması (Q10) ya da kamera tazelik cezası nedeniyle nominal SKT'den erken.</p>
  </section>
  <section class="panel"><h2>Uyarılar</h2>${uyariListesi(uyarilar())}</section>`;
}

// ---------- görüntü
function goruntuCiz() {
  const taramalar = [...S.taramalar].sort((a, b) => b.t - a.t || b.id - a.id);
  if (!taramalar.some(g => g.id === UI.seciliTarama)) UI.seciliTarama = taramalar[0]?.id ?? null;
  const secili = taramalar.find(g => g.id === UI.seciliTarama);
  const lotNo = Object.fromEntries(S.lotlar.map(x => [x.id, x.lotNo])), konum = lotKonumlari();
  const tespitler = secili ? S.tespitler.filter(t => t.taramaId === secili.id).sort((a, b) => a.skor - b.skor) : [];
  const ayik = ayiklanacaklar().length, m = UI.goruntuMesaj;
  return `
  <section class="panel">
    <div class="arac">
      <button type="button" class="ana" data-a="tarama-simule">Kamera taraması simüle et</button>
      <label class="btn" for="jsonDosya">JSON dosyası yükle</label>
      <input type="file" id="jsonDosya" accept=".json,application/json" hidden>
      <button type="button" data-a="ekip-ciktisi">Ekibin örnek çıktısını yükle (13.11)</button>
      <span class="bosluk"></span>
      <button type="button" class="tehlike" data-a="ayikla" ${ayik ? "" : "disabled"}>Bozulanları ayıkla (imha)${ayik ? ` · ${ayik}` : ""}</button>
    </div>
    <p class="not">Gerçek sistemde görüntü yazılımı rafın son durumunu <code>depo_son_durum.json</code> dosyasına yazar, WMS bu dosyayı 30 saniyede bir okur. Kamerada bozulma oranı (30 gün): <b class="sayi">%${Math.round(100 * bozulmaOrani())}</b>. Tazelik ${AYAR.bozulma}'in altındaysa ürün bozuk sayılır; ${AYAR.dikkat}'nin altındaysa lot öncelikli sevke alınır.</p>
    <details><summary>JSON'u yapıştırarak gönder</summary>
      <div style="display:grid;gap:8px;margin-top:8px">
        <textarea id="jsonMetin" spellcheck="false" aria-label="Görüntü işleme JSON çıktısı">${esc(JSON.stringify(EKIP_CIKTISI, null, 2))}</textarea>
        <div><button type="button" data-a="json-isle">İşle</button></div>
      </div>
    </details>
    ${m ? `<div class="bilgi-kutu ${m.tur}"><b>${esc(m.baslik)}</b>${m.satirlar.length ? `<ul>${m.satirlar.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}</div>` : ""}
  </section>
  <div class="iki">
    <section class="panel">
      <h2>Tespit edilen ürünler${secili ? ` · ${esc(secili.raf)} · ${fDTs(secili.t)}` : ""}</h2>
      ${secili ? `<div class="tablo-kap"><table>
        <thead><tr><th>Ürün ID (QR)</th><th>Tür</th><th>Sistemdeki ürün</th><th>Lot</th><th>Konum</th><th>Tazelik</th><th>Durum</th></tr></thead>
        <tbody>${tespitler.map(t => {
          const e = S.etiketler[t.pid];
          const [c, ad] = e?.durum === "AYIKLANDI" ? ["ayiklandi", "Ayıklandı"] : t.bozuk ? ["bozuk", "Ayıklanmalı"] : t.skor < AYAR.dikkat ? ["dikkat", "Öncelikli sevk"] : ["taze", "Taze"];
          return `<tr><td class="mono">${esc(t.pid)}</td><td>${esc(t.tur)}</td><td>${esc(t.gtin ? urun(t.gtin).ad : "TANIMSIZ")}</td><td class="mono">${esc(lotNo[e?.lotId] || "–")}</td><td class="mono">${esc(konum[e?.lotId] || "–")}</td><td class="sayi">${sayi(t.skor, 2)}</td><td>${hap(`t-${c}`, ad)}</td></tr>`;
        }).join("")}</tbody></table></div>
        ${secili.mesaj.length ? `<div class="bilgi-kutu"><b>Bu taramadaki notlar</b><ul>${secili.mesaj.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`
        : `<p class="not">Henüz tarama yok.</p>`}
    </section>
    <section class="panel">
      <h2>Kamera taramaları</h2>
      <div class="tablo-kap kaydir"><table>
        <thead><tr><th>Tarama zamanı</th><th>Raf</th><th>Ürün</th><th>Bozuk</th><th>Kaynak</th></tr></thead>
        <tbody>${taramalar.map(g => `<tr class="secilebilir ${g.id === UI.seciliTarama ? "secili" : ""}" data-a="tarama-sec" data-id="${g.id}" tabindex="0"><td>${fDTs(g.t)}</td><td>${esc(g.raf)}</td><td>${g.n}</td><td>${S.tespitler.filter(t => t.taramaId === g.id && t.bozuk).length}</td><td>${esc(g.kaynak)}</td></tr>`).join("")}</tbody>
      </table></div>
    </section>
  </div>`;
}
function goruntuIsle(veri, kaynak) {
  let rapor;
  try { rapor = raporCoz(veri); } catch (e) { UI.goruntuMesaj = { tur: "kotu", baslik: e.message, satirlar: [] }; ciz(); return; }
  const tarama = raporKaydet(rapor, kaynak);
  if (!tarama) { UI.goruntuMesaj = { tur: "", baslik: `${rapor.raf} ${fDTs(rapor.t)} taraması zaten işlenmiş.`, satirlar: [] }; ciz(); return; }
  const bozuk = rapor.tespitler.filter(t => t.bozuk).length;
  UI.seciliTarama = tarama.id;
  UI.goruntuMesaj = { tur: bozuk ? "kotu" : "iyi", baslik: `${rapor.raf}: ${rapor.tespitler.length} ürün işlendi, ${bozuk} bozuk.`, satirlar: tarama.mesaj };
  degisti();
}

// ---------- tahmin
function tahminCiz() {
  const rapor = UI.tahminCache ||= tahminRaporu();
  if (!rapor.some(r => r.gtin === UI.seciliTahmin)) UI.seciliTahmin = (rapor.find(r => r.siparis) || rapor[0])?.gtin;
  const sec = rapor.find(r => r.gtin === UI.seciliTahmin);
  return `
  <section class="panel">
    <p class="not">Her ürün için son 60 günün çıkışları alınır, 5 yöntem son 28 günde karşılaştırılır ve MAD'i en küçük olan seçilir. Emniyet stoğu SS = z·RMSE·√L (z = 1,65), yeniden sipariş noktası ROP = d̄·L + SS. Sipariş miktarı raf ömrü boyunca tüketilebilecek miktarla sınırlıdır.</p>
    <div class="tablo-kap kaydir"><table>
      <thead><tr><th>Ürün</th><th>En iyi yöntem</th><th>MAD</th><th>MAPE %</th><th>7 gün tahmin</th><th>Stok</th><th>ROP</th><th>Yeterlilik (gün)</th><th>Öneri</th></tr></thead>
      <tbody>${rapor.map(r => `<tr class="secilebilir ${r.gtin === UI.seciliTahmin ? "secili" : ""}" data-a="tahmin-sec" data-g="${r.gtin}" tabindex="0"><td>${esc(r.urun)}</td><td>${esc(r.yontem)}</td><td>${sayi(r.MAD, 2)}</td><td>${sayi(r.MAPE)}</td><td>${Math.round(r.gelecek.reduce((x, y) => x + y, 0))}</td><td>${r.stok}</td><td>${Math.round(r.ROP)}</td><td>${sayi(r.kalanGun)}</td><td>${r.siparis ? hap("s-KRITIK", `Sipariş ver: ${r.siparis}`) : `<span class="not">Yeterli</span>`}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>
  ${sec ? `<section class="panel"><h2>${esc(sec.urun)} · son 28 gün ve 7 günlük tahmin</h2><div class="grafik">${grafik(sec)}</div></section>` : ""}`;
}
function grafik(r) {
  const W = 880, H = 260, sol = 44, sag = 16, ust = 30, alt = 34;
  const gercek = r.seri.slice(-28), gecmis = r.gecmis.slice(-28), gelecek = r.gelecek, n = gercek.length + gelecek.length;
  const tepe = Math.max(...gercek, ...gelecek, 1) * 1.15;
  const x = i => sol + i * (W - sol - sag) / (n - 1), y = v => H - alt - v / tepe * (H - ust - alt);
  const yol = pts => pts.map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const izgara = [0, 0.25, 0.5, 0.75, 1].map(f => { const v = tepe / 1.15 * f; return `<line x1="${sol}" x2="${W - sag}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${sol - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }).join("");
  const xb = x(gercek.length - 0.5);
  const gecmisPts = gecmis.map((v, i) => [i, v]).filter(([, v]) => v != null);
  const ileri = [[gercek.length - 1, gercek[gercek.length - 1]], ...gelecek.map((v, i) => [gercek.length + i, v])];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(r.urun)} talep grafiği">
    ${izgara}
    <line x1="${xb}" x2="${xb}" y1="${ust}" y2="${H - alt}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${xb}" y="${H - alt + 18}" text-anchor="middle">bugün</text>
    <text x="${sol}" y="${H - 6}">28 gün önce</text><text x="${W - sag}" y="${H - 6}" text-anchor="end">+7 gün</text>
    <path d="${yol(gercek.map((v, i) => [i, v]))} L${x(gercek.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--accent)" opacity=".1"/>
    <path d="${yol(gercek.map((v, i) => [i, v]))}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${gecmisPts.length > 1 ? `<path d="${yol(gecmisPts)}" fill="none" stroke="var(--orta)" stroke-width="1.3" opacity=".8"/>` : ""}
    <path d="${yol(ileri)}" fill="none" stroke="var(--orta)" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="${x(n - 1)}" cy="${y(gelecek[gelecek.length - 1])}" r="3.5" fill="var(--orta)"/>
    <g transform="translate(${sol},12)"><rect width="14" height="3" y="-4" fill="var(--accent)"/><text x="20" y="0">gerçek tüketim</text>
    <rect x="130" width="14" height="3" y="-4" fill="var(--orta)"/><text x="150" y="0">${esc(r.yontem)} (geçmiş ve 7 gün tahmin)</text></g>
  </svg>`;
}

// ============================================================ olaylar
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  if (a === "demo-barkod") demoBarkod();
  else if (a === "goz") { UI.seciliGoz = el.dataset.k; ciz(); }
  else if (a === "konumlandir") { UI.tasima = yenidenKonumlandir(); bildir(UI.tasima.length ? `${UI.tasima.length} lot için taşıma listesi oluşturuldu.` : "Tüm lotlar doğru bantta."); degisti(); }
  else if (a === "imha") { const d = suresiDolanlariImhaEt(); bildir(`${d.length} lot imha kaydına alındı (${d.reduce((x, l) => x + l.miktar, 0)} birim).`); degisti(); }
  else if (a === "tarama-simule") goruntuIsle(kameraTaramasiSimuleEt(), "kamera simülasyonu");
  else if (a === "ekip-ciktisi") goruntuIsle(JSON.parse(JSON.stringify(EKIP_CIKTISI)), "depo_son_durum.json (ekip)");
  else if (a === "json-isle") goruntuIsle($("jsonMetin").value, "yapıştırılan JSON");
  else if (a === "ayikla") {
    const sonuc = bozulanlariAyikla();
    UI.goruntuMesaj = { tur: "iyi", baslik: `${sonuc.length} ürün raftan alındı.`, satirlar: sonuc.map(([t, l]) => `${t.pid} (${t.gtin ? urun(t.gtin).ad : t.tur}): ${l ? `lot ${l.lotNo}, ${AYAR.birim} birim imha` : "bağlı lot yok, yalnızca işaretlendi"}`) };
    degisti();
  }
  else if (a === "tarama-sec") { UI.seciliTarama = +el.dataset.id; ciz(); }
  else if (a === "tahmin-sec") { UI.seciliTahmin = el.dataset.g; ciz(); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-a]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "okutForm") return;
  e.preventDefault();
  const g = $("barkod");
  if (!g.value.trim()) { g.focus(); return; }
  UI.son = barkodOkut(g.value, UI.islem);
  if (!UI.son.basarili) bildir(UI.son.mesaj);
  degisti();
});
document.addEventListener("change", e => {
  if (e.target.name === "islem") UI.islem = e.target.value;
  if (e.target.id === "jsonDosya" && e.target.files[0]) {
    const f = e.target.files[0], okuyucu = new FileReader();
    okuyucu.onload = () => goruntuIsle(String(okuyucu.result).replace(/^﻿/, ""), f.name);
    okuyucu.onerror = () => { UI.goruntuMesaj = { tur: "kotu", baslik: "Dosya okunamadı.", satirlar: [] }; ciz(); };
    okuyucu.readAsText(f, "utf-8");
  }
});
$("sifirla").addEventListener("click", () => {
  const b = $("sifirla");
  if (!UI.sifirlaOnay) {
    UI.sifirlaOnay = true; b.textContent = "Emin misin? Tekrar tıkla"; b.className = "onay";
    setTimeout(() => { UI.sifirlaOnay = false; b.textContent = "Demo verisini sıfırla"; b.className = "tehlike"; }, 4000);
    return;
  }
  UI.sifirlaOnay = false; b.textContent = "Demo verisini sıfırla"; b.className = "tehlike";
  Object.assign(UI, { son: null, seciliGoz: null, tasima: null, seciliTarama: null, goruntuMesaj: null, seciliTahmin: null });
  ornekOlustur(); degisti(); bildir("Demo verisi baştan oluşturuldu.");
});
window.addEventListener("hashchange", () => { ciz(); window.scrollTo({ top: 0 }); });

// ============================================================ başlat
S = yukle();
if (!S) ornekOlustur();
tumGruplariOlc(); kaydet(); ciz();
setInterval(() => { tumGruplariOlc(); kaydet(); sensorCiz(); sekmeCiz(); }, AYAR.sensorSn * 1000);
</script>
</body>
